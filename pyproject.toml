[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodeops-mcp"
version = "0.6.0rc2"
description = "Read-only Proxmox VE inspection over MCP — no mutating verbs in the tool surface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic-settings>=2.16.1",
    "structlog>=26.1.0",
]

[project.scripts]
nodeops-mcp = "nodeops_mcp.server:main"
nodeops-console = "nodeops_mcp.console.app:main"
proxmox-mcp = "nodeops_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nodeops_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]
