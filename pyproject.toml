[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxmox-mcp"
version = "0.1.0"
description = "Read-only Proxmox VE inspection over MCP — no mutating verbs in the tool surface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic-settings>=2.16.1",
    "structlog>=26.1.0",
]

[project.scripts]
# Setup and inspection helper: discover, check, simulate.
proxmox-mcp = "proxmox_mcp.cli:main"
# The MCP server itself.
proxmox-mcp-server = "proxmox_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proxmox_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]
